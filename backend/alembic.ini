# SignalFlow 后端 - Alembic 迁移配置
# 执行迁移前先按 app/core/config.py 提供 DATABASE_URL（.env 或环境变量）。

[alembic]
script_location = alembic
prepend_sys_path = .
# 迁移脚本里通过 app.core.config 读取数据库地址
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S